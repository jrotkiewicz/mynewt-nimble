syscfg.defs:
    BLE_HOGP_RMAP_MAX_USAGES:
        description: >
            Maximum number of Usage items collected for a single Main item.
            A Usage Minimum/Usage Maximum pair counts as one entry.
        value: 16

    BLE_HOGP_RMAP_STACK_DEPTH:
        description: >
            Maximum number of nested Push items.
        value: 4
