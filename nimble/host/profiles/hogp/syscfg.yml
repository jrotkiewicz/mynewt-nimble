syscfg.defs:
    BLE_HOGP_SYSINIT_STAGE:
        description: >
            Sysinit stage for the HOGP host. Must run after the host is
            initialized, as it registers a GAP event listener.
        value: 303

    BLE_HOGP_MAX_CONNS:
        description: >
            Maximum number of connections the HOGP host can be attached to
            at the same time.
        value: 1
        restrictions:
            - 'BLE_HOGP_MAX_CONNS <= BLE_MAX_CONNECTIONS'

    BLE_HOGP_MAX_HIDS:
        description: >
            Maximum number of HID Service instances handled per connection.
        value: 1

    BLE_HOGP_MAX_REPORTS:
        description: >
            Maximum number of Report characteristics handled per connection,
            across all HID Service instances. Additional ones are ignored.
        value: 8

    BLE_HOGP_MAX_BAS:
        description: >
            Maximum number of Battery Service instances handled per
            connection.
        value: 1

    BLE_HOGP_REPORT_MAP_MAX_SIZE:
        description: >
            Size of the Report Map buffer of each HID Service instance.
            Longer Report Maps are truncated. HIDS limits them to 512 bytes.
        value: 512

    BLE_HOGP_REPORT_MAX_SIZE:
        description: >
            Maximum size of a report delivered in an event. Longer reports
            are truncated.
        value: 64

    BLE_HOGP_AUTO_SECURITY:
        description: >
            Initiate security (pairing or encryption) when attaching to a
            connection that is not encrypted.
        value: 1

    BLE_HOGP_EXCHANGE_MTU:
        description: >
            Perform the ATT MTU exchange before service discovery.
        value: 1

    BLE_HOGP_FIND_INCLUDED:
        description: >
            Look for Battery Service instances included in the HID Service.
        value: 1

    BLE_HOGP_ENOMEM_RETRY_MS:
        description: >
            Delay before retrying a GATT procedure that could not be started
            because no procedure was available (BLE_GATT_MAX_PROCS).
        value: 20

    BLE_HOGP_LOG_MOD:
        description: 'Numeric module ID to use for HOGP log messages.'
        value: 30

    BLE_HOGP_LOG_LVL:
        description: 'Minimum level for the HOGP log.'
        value: 1

syscfg.logs:
    BLE_HOGP_LOG:
        module: MYNEWT_VAL(BLE_HOGP_LOG_MOD)
        level: MYNEWT_VAL(BLE_HOGP_LOG_LVL)

syscfg.restrictions:
    - 'BLE_ROLE_CENTRAL'
    - 'BLE_SM_LEGACY || BLE_SM_SC'
    - 'BLE_GATT_DISC_ALL_SVCS'
    - 'BLE_GATT_DISC_ALL_CHRS'
    - 'BLE_GATT_DISC_ALL_DSCS'
    - 'BLE_GATT_READ'
    - 'BLE_GATT_READ_LONG'
    - 'BLE_GATT_WRITE'
    - 'BLE_GATT_WRITE_NO_RSP'
    - 'BLE_GATT_NOTIFY'
    - '!BLE_HOGP_FIND_INCLUDED || BLE_GATT_FIND_INC_SVCS'
