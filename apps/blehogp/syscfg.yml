syscfg.vals:
    CONSOLE_IMPLEMENTATION: full
    LOG_IMPLEMENTATION: full
    STATS_IMPLEMENTATION: full

    # Keep the console for the application: no host INFO logs (one per GATT
    # procedure), but those of the HOGP host.
    LOG_LEVEL: 1
    BLE_HS_LOG_LVL: 2

    # The Report Map parser keeps its state on the stack (words).
    OS_MAIN_STACK_SIZE: 1024

    # Central only.
    BLE_ROLE_BROADCASTER: 0
    BLE_ROLE_CENTRAL: 1
    BLE_ROLE_OBSERVER: 1
    BLE_ROLE_PERIPHERAL: 0

    # HID devices require an encrypted link and reconnect to the host they
    # are bonded with. Keys of both kinds are exchanged, so that devices
    # using private addresses are recognized.
    BLE_SM_LEGACY: 1
    BLE_SM_SC: 1
    BLE_SM_BONDING: 1
    BLE_SM_OUR_KEY_DIST: 0x03
    BLE_SM_THEIR_KEY_DIST: 0x03

    # Keep the bonds across resets (sys/config on FCB). Without them a HID
    # device has to be put in pairing mode again after every reset.
    BLE_STORE_CONFIG_PERSIST: 1
    CONFIG_FCB: 1
